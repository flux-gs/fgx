#==============================================================================
# FGX System Configuration
#
# This file is read by the build script to generate assembly equates.
# Format: key = value
# Lines starting with # are comments. Blank lines are ignored.
#
# Colors use IIgs 12-bit RGB: $0RGB (0-F per channel)
#==============================================================================

#------------------------------------------------------------------------------
# Video - SHR 640x200 framebuffer
#------------------------------------------------------------------------------

# Background color (fills entire screen at boot)
video.bg_color = $0333

# Text foreground color
video.fg_color = $0FFF

# Accent color (logo highlights, UI elements)
video.accent_color = $0AAA

# Secondary color (borders, separators)
video.secondary_color = $0000

#------------------------------------------------------------------------------
# Kernel
#------------------------------------------------------------------------------

# Maximum simultaneous tasks (one knob: sizes the TCB table, the scheduler-state
# table, the kernel-C register-file saves, the kernel-image homes and the
# per-pid name and cwd tables).  -> CFG_KERNEL_NPROC.  Nothing in bank 0 scales
# with it: a task's direct page rides in its stack reservation and its kernel
# image lives in a slot.  What bounds it: the TCB table (64 B per task from
# $0800, ending at FGX_CODE -- 32 fills it exactly; past 32 FGX_CODE and its
# lockstep list move up), the signal tables and _kAlarmTicks in memmap.s
# (sized for 32), the home images (2 KB per pid in one bank, so 32 at most),
# and kernel heap.
kernel.nproc = 32

# The slot a Second Sight card sits in, for the sscon console module
# (src/modules/sscon).  The card has no slot signature, so the module asks
# this slot alone, and only a card answers 'GSVGA'; 0 disables.  MAME adds the
# card with -sl3 secondsight.  -> CFG_SSCON_SLOT.
sscon.slot = 3

# THE KERNEL-IMAGE SLOTS: how many tasks can be inside the kernel at once
# without a copy, and how deep each one's kernel stack is.  A slot is one
# direct page in the mapped $D000 bank plus kernel.kstk bytes of stack in the
# flat 8 KB above $E000.  A task binds a slot when the scheduler picks it and
# keeps it while it sleeps; when every slot is held and another task needs
# one, a sleeper's page and the live part of its stack are parked in the home
# bank and come back when it next runs.  The slot count does NOT bound NPROC.
# genconfig.py places the slots and the interrupt-time context above them;
# check_bank0_geometry.py checks the fit.  -> CFG_KERNEL_KSLOTS, CFG_KERNEL_KSTK.
kernel.kslots = 7
kernel.kstk = 1024

# THE TWO MEMORY MANAGER HANDLES THE LOADER CLAIMS.  The kernel handle is
# kernel.banks contiguous banks: core, far and tty.  The rest-of-OS handle is
# the console bank, the font bank, rest.kmod_banks for the modules the boot
# program stages from /fgxunix (vfs, ufs, ufsdir), rest.heap_banks for the
# kernel heap's boot arenas, then rest.user_banks for the user pool.  The
# loader shrinks the rest claim one bank at a time on a small machine and
# halts once fewer than rest.min_user_banks user banks would remain.
# genconfig.py derives the region offsets, the claim and its floor from these,
# so the loader, the kernel and tools/mkfgxunix.py cannot disagree.
# -> CFG_KERNEL_BANKS, CFG_REST_*.
kernel.banks = 3
rest.kmod_banks = 3
rest.heap_banks = 2
rest.user_banks = 56
rest.min_user_banks = 3

# kernel.stkover -- the smallest user-stack request (pages) that may be placed
# OVER other tasks' reservations when the arena has no free run for it.  The
# overlapped tasks are parked -- their live bytes copied to a home image in a
# swap bank -- and come back to the same addresses when they next run, so
# bank 0 holds only the stacks that are in use.  1 lets any request overlap,
# so a full arena parks a sleeper instead of failing the spawn with ENOMEM:
# the price is a copy of the sleeper's live extent, a few hundred bytes for
# a tool, and a runnable sleeper is held for its dwell first.  40 would admit
# only the session shells (tcsh asks 76; nothing else asks more than 29) and
# let a pipeline stage fail as it once did; 0 never overlaps.  Provisional,
# with the reservation floors in the linker: adjust from measurement in use.
kernel.stkover = 1

# Kernel-C probe.  1 THROUGH UFS 1.5 (2026-08-10); 0 is the eventual
# production value.
#
# The reason it stays on is COVERAGE, not convenience.  The harness builds ONE
# image per run, so a suite against a kcprobe=0 kernel has zero kernel-C
# coverage -- and the asm->C seam has produced two silent bank bugs in two
# consecutive sessions, the direct page in kc_sys.s and then the data bank in
# _BufInit, both of the kind where nothing is undefined and the bytes that come
# back look plausible.  What it costs is bounded and measured: 16 KB of Kmalloc
# heap for the buffer arena (NBUF 16 * FS_BLKSIZE 1024), 1408 B for the
# register-file save table, and far bank that is not scarce.  Nothing reads the
# arena until 1.5 gives bread() a filesystem.
#
# tools/mame_test/tests/kcprobe.json deliberately declares NO `requires`, so
# setting this to 0 turns the suite RED rather than skipping.  That is the
# intended signal: a red says the only coverage the seam has was just switched
# off, where a skip would say nothing at all.
#
# At 1 the far bank carries fcc's runtime and a compiled C translation unit,
# export slot 27 points at it, and boot runs it and logs "kernel C: ok".  That
# is the only end-to-end proof the asm->C boundary works, so it is what a
# kernel-C debug build is FOR -- but it costs ~3.9 KB of the far bank and an
# export slot, and it runs a probe on the boot path, none of which a shipping
# kernel should carry.
#
# To build the debug kernel:  set this to 1, `ninja disk`, and the smoke test's
# kernel-C assertions become meaningful (see docs/history/audits/
# 2026-08-09-kernel-c-01-gate/README.md).
kernel.kcprobe = 1

# VFS wiring probe.  0 = default, and the default is not a matter of taste:
# THIS PROBE WRITES TO A DISK ON THE BOOT PATH.
#
# It scans every ONLINE device for a 2.11BSD superblock and, on the one it
# finds, writes two device blocks and reads them back through the buffer cache.
# That is the only way to prove the wiring end to end -- the cache's own flags
# cannot settle a question about the cache -- but a kernel that does it on
# somebody's real volume at every boot is not one to ship, however carefully it
# identifies its target first.
#
# Separate from kernel.kcprobe because the two ask different questions.
# kcprobe asks "is kernel C compiled in and does the seam work", which is
# harmless and self-contained; this asks "does the buffer cache reach the
# disk", which is not.  They shared a switch until the write got noticed.
#
# Set to 1 and rebuild to run tools/mame_test/tests/vfswire.json, which
# declares this requirement and skips without it.
#
# FLIPPING THIS IS NOW ONE STEP -- `ninja disk/ufsscratch.fs`, rebuild, run.
#
# It used to be a four-step whose FIRST BUILD FAILED BY DESIGN: the probe's call
# site lived in main.s as _kfp342, the generated bank-patch tables are TRACKED
# and config-dependent, and turning the probe off left far_patchsites.s naming a
# label that no longer existed.  The recommended cure was to delete the offending
# DA line by hand and regenerate three tables.
#
# The probe moved into vfs.mod on 2026-08-12 and took its call site with it, so
# no tracked kernel table depends on this switch any more.  A module is compiled
# whole regardless of the gate; only whether mod_init CALLS the probe changes,
# and that is a `DO`/`FIN` inside the module.  kernel.kcprobe still has the old
# shape -- see the three-step note in include/kernelc.s -- because the far bank's
# own C is still reached from main.s.
kernel.vfsprobe = 0

# kernel.ufsprobe -- run the FILESYSTEM self-test at VFS bring-up: the 2.11BSD
# superblock (UFS 1.10a) and the block and inode allocators (1.10b).  SPLIT OUT
# OF kernel.vfsprobe AT 1.10b, and a bank fact rather than a taxonomy.
#
# The allocators cost about 5.9 KB of SHIPPING code -- ufs_alloc.c plus the
# superblock encoder and the chain-block codec -- which comes out of the same
# 65,536-byte module bank the probes live in.  With them linked, vfsprobe = 1
# had 410 bytes free before ufs_probe.c was assembled at all.  Merlin reports
# that as "Object code size > 64 KB" and names the file it happened to be in,
# which is not where the space went.
#
# The two ask different questions in any case.  vfsprobe asks whether the
# BUFFER CACHE is wired -- does a bread reach a device block, does a write land
# in the right bank, does one filesystem block become two device transfers.
# This asks whether the code that reads a FILESYSTEM agrees with tools/fgxfs.py
# about what is on the volume, which is the campaign's goal-2 claim and needs
# no cache assertions at all.
#
# IT WRITES, AND IT PUTS THE SUPERBLOCK BACK.  The allocator cases hand out
# real blocks off the free list; the superblock block is saved and restored
# byte for byte around them, including on failure, because the image is handed
# to MAME by path with no per-run copy.
#
# Setting this and vfsprobe together does not fit; the ERR guard at the end of
# src/modules/vfs/vfs.s is what refuses the combination.
kernel.ufsprobe = 0

# kernel.ufsvnprobe -- run the FILESYSTEM self-test THROUGH ITS VNODE
# OPERATIONS: the mount (1.8a), the in-core inode and its hash (1.11a), the
# read path (1.11b), the name lookup (1.11c) and the WRITE path (1.12a).
# SPLIT OUT OF kernel.ufsprobe AT 1.12a, the fourth such split, and again a
# bank fact rather than a taxonomy.
#
# The numbers, measured 2026-08-20 at the commit before 1.12a: ufs.mod ships at
# 29,372 bytes and kernel.ufsprobe = 1 added 31,915 for 61,287, leaving 4,249
# of the bank.  1.12a's SHIPPING code -- ufs_write, ufs_fsync, ufs_bmapx's
# allocation arm, iupdat and ufs_iencode -- is 4,612 bytes, which put the
# single-gate build 363 bytes over before the write cases existed.  1.12b and
# 1.12c add several times that.
#
# The seam is the MOUNT.  ufsprobe never builds a struct mount and works on
# raw blocks and the superblock; this one mounts the volume and works on files.
# Case numbers do NOT restart across the two -- 700-715 the mount, 750-762 the
# inode hash, 800-819 the read path, 820-856 the lookup, 860-900 the write --
# so a reported code still names one property without naming a gate first.
#
# IT WRITES, AND MORE THAN THE ALLOCATORS DO.  The 1.12a cases put a real file
# on the volume: inode 5, which the probe first checks is free, and three
# blocks off the free list.  The free list is restored by the caller and the
# inode slot by the write cases themselves, both including on failure, because
# the image is handed to MAME by path with no per-run copy.
#
# Mutually exclusive with kernel.ufsprobe, and with vfsprobe for the older
# reason; the ERR guard at the end of src/modules/ufs/ufs.s refuses the
# combination.
kernel.ufsvnprobe = 0

# kernel.ufswprobe -- run the FILESYSTEM self-test through its WRITING vnode
# operations: write and fsync (1.12a), readlink, and truncate, setattr and the
# unlink-while-open release (1.12b).  SPLIT OUT OF kernel.ufsvnprobe AT 1.12b,
# the FIFTH such split in this tree and the third in this module, and again a
# bank fact rather than a taxonomy.
#
# 1.12b's shipping code -- itrunc, indirtrunc with its 3 KB per-level copy
# table, setattr and inactive -- is 9,778 bytes, taking ufs.mod from 34,283 to
# 44,061 of the 65,536 in a bank.  The vnode gate went over with it.
#
# The seam is READING versus WRITING.  ufsvnprobe keeps the mount, the inode
# hash, getattr/read and lookup/readdir; this one takes everything that changes
# the volume.  Case numbers do not overlap: 860-912 the write path, 920-960
# truncate and release.
#
# IT WRITES MORE THAN ANY OTHER GATE.  Inodes 5, 6 and 7 -- each checked free
# first -- and blocks off the free list, restored by the caller and by the
# sections themselves, including on failure.  The image is handed to MAME by
# path with no per-run copy.
#
# Mutually exclusive with the other two filesystem gates; the ERR in
# include/kernelc.s refuses any combination.
kernel.ufswprobe = 0

# kernel.ufsdevprobe -- run the FILESYSTEM self-test over DEVICE FILES: mknod,
# the on-disk IFCHR/IFBLK inode, and the alias chain that makes two names for
# one device reach ONE vnode (1.13a).
#
# SPLIT OUT OF kernel.ufswprobe AT 1.13a, the fifth such split, and the first
# one forced by the PROBE module rather than by the module under test.  With
# kernel.ufswprobe = 1 ufsprobe.mod is 64,295 bytes of 65,536 -- 1,241 free --
# so the next case of any size does not link, whichever file it goes in.  The
# writing gate is the one that filled up because 1.12c put three directory
# guards in it; this gate starts empty.
#
# It WRITES: it makes device nodes on the scratch volume and puts the i-list
# slots back, on the same terms every writing section here uses.  Mutually
# exclusive with the other three.
kernel.ufsdevprobe = 0

# kernel.vnopsprobe -- run the FILE/VNODE GLUE self-test: vn_open, vn_read,
# vn_write, vn_close and vn_rdwr against a real path on the scratch volume
# (1.7c).
#
# THE SIXTH SPLIT, and the first whose subject is not the filesystem.  What it
# drives is the layer BETWEEN a `struct file` and a vnode -- the piece a
# syscall calls -- so it belongs beside the four filesystem gates rather than
# inside one: those assert what UFS does with a vnode it is handed, and this
# asserts how a vnode comes to be handed over at all.
#
# It WRITES: vn_open with FCREAT makes files on the scratch volume and the
# probe removes them again, on the same terms every writing section here uses.
# Mutually exclusive with the other four.
kernel.vnopsprobe = 0

# kernel.spext -- issue EXTENDED ($4x) SmartPort calls at all.
#
# 1 (default): the block driver may use the extended ReadBlock ($41) and the
# generic multi-block Read ($48) on a bus whose $CnFB advertises extended
# addressing AND whose devices claim it in their DIB subtype byte.  Both gates
# must pass, and a failed $41 still latches the bus back down to the standard
# path (block.s Blk_DetectCaps / _SP_ReadBlock).
#
# 0: never issue a $4x call, whatever anything claims.  This is the last resort
# for a device that HANGS rather than answering -- a FloppyEmu on the DB19 port
# does not reply to command $41 at all, and a call that never returns is past
# the reach of any error path (apple/fgx#119).  The gates above are meant to
# keep that from ever being needed; this is here so a machine that hits it can
# be booted without a source change.
kernel.spext = 1
