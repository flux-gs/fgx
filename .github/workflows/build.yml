# Host-side build of FGX: the toolchain, its library tests, and the release
# disk image; on a vX.Y.Z tag, a GitHub release carrying that image, and on
# main, the image of that commit on the rolling `main-latest' pre-release.
# The emulator tests do not run here: they need an Apple IIgs ROM, which cannot
# be distributed.
#
# It runs on a version tag, on every push to main (which is a merged pull
# request, since main takes nothing else), and by hand (Actions > build > Run
# workflow).  Pull requests, from forks or otherwise, never start it.
name: build
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels the run it replaces rather than queueing
# another.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The build reads the repository and nothing more; the release job asks for
# write access to releases itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history, so /etc/version is `git describe' against the v* tags
      # (v2.0.0-5-g712de08 on main) rather than a bare hash.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 ninja-build xxd file unifdef

      # merlin32 at the commit FGX builds with, plus the one fix FGX carries:
      # a CR look-back that reads before the source buffer.  Upstream plus
      # this patch is byte-for-byte the tree FGX's own builds use.
      - name: Merlin32
        run: |
          git clone https://github.com/digarok/merlin32 /tmp/merlin32
          git -C /tmp/merlin32 checkout --detach a0fe91076aab094a3af92818ad785333ba66ccd2
          git -C /tmp/merlin32 apply "$GITHUB_WORKSPACE/.github/merlin32-cr-lookback.patch"
          make -C /tmp/merlin32/Source
          sudo install -m755 /tmp/merlin32/Source/merlin32 /usr/local/bin/merlin32

      # cadius at a fixed commit, the one FGX's own builds use.
      - name: cadius
        run: |
          git clone https://github.com/mach-kernel/cadius /tmp/cadius
          git -C /tmp/cadius checkout --detach 75c4aa684f6aa0de0c2879b729be465196a348ba
          make -C /tmp/cadius release
          sudo install -m755 /tmp/cadius/bin/release/cadius /usr/local/bin/cadius

      - name: Toolchain
        run: make -C toolchain

      - name: Disk image
        run: |
          python3 tools/ninja/gen.py
          ninja release

      # After the image: the library tests read build/static_libs, which
      # only ninja writes.
      - name: Toolchain library tests
        run: make -C toolchain test-libs

      # fcc's own suites, as the maintainers' gate runs them: the golden
      # fixtures (a run that finds no fixtures fails too, rather than reading
      # as green), the programs fcc must refuse after their runner's
      # self-test, and the --sections check.  fcc's output does not depend on
      # the compiler that built it (apple/fgx#544), so a golden that differs
      # here is a real change.
      - name: fcc fixtures
        run: |
          # The fixtures link against these; `ninja release' builds only what
          # the image needs, which leaves libtermlib out.
          ninja build/static_libs/libfgx.s build/static_libs/libtermlib.s \
                build/static_libs/ffltpr.s
          bash toolchain/tests/run.sh > fixtures.log 2>&1 || true
          s=$(grep -E '[0-9]+ passed, [0-9]+ failed' fixtures.log | tail -1)
          echo "fixtures: ${s:-no summary}"
          echo "$s" | grep -qE '^[1-9][0-9]* passed, 0 failed$' || {
            grep -E '^FAIL ' fixtures.log | head -20; tail -5 fixtures.log; exit 1; }
          bash toolchain/tests/run_reject.sh --self-test
          bash toolchain/tests/run_reject.sh
          (cd toolchain && python3 tests/sections.py)

      - uses: actions/upload-artifact@v7
        with:
          name: fgxroot
          path: disk/fgxroot.fs

  # A vX.Y.Z tag publishes the image it built as fgx-X.Y.Z.fs.  Re-pushing a
  # tag replaces the asset rather than failing on the existing release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fgxroot

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          img="fgx-$v.fs"
          cp fgxroot.fs "$img"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$img" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$img#$img (32MB hard-disk image)" \
              --repo "$GITHUB_REPOSITORY" --title "FGX $GITHUB_REF_NAME" \
              --notes "Bootable image: $img (32MB hard disk).  See CHANGELOG.md.  The image includes GPL programs (frotz); their source is this release's tagged tree."
          fi

  # A push to main publishes its image on the `main-latest' pre-release as
  # fgx-main-<sha>.fs, moves that tag to the commit, and keeps only the newest
  # MAIN_KEEP images there.  Release assets live outside git, so nothing here
  # grows the repository; a pre-release is never marked Latest, so the newest
  # vX.Y.Z stays the release GitHub points people at.
  main-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: main-latest
      MAIN_KEEP: 3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fgxroot

      - name: Publish
        run: |
          sha="${GITHUB_SHA:0:7}"
          img="fgx-main-$sha.fs"
          cp fgxroot.fs "$img"
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Disk images of the newest $MAIN_KEEP commits on main, newest $sha.  Untested builds between releases: the emulator tests need an Apple IIgs ROM and do not run in CI.  For a release, take the newest vX.Y.Z.  The image includes GPL programs (frotz); their source is the commit named in the file name."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --notes "$notes"
          else
            gh release create "$TAG" --prerelease --latest=false \
              --title "FGX main (rolling)" --notes "$notes"
          fi
          gh release upload "$TAG" "$img#$img (32MB hard-disk image, main $sha)" --clobber

      - name: Prune
        run: |
          id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          gh api --paginate "repos/$GH_REPO/releases/$id/assets" \
            --jq '.[] | select(.name | startswith("fgx-main-")) | [.created_at, .id, .name] | @tsv' |
            sort -r | tail -n +$((MAIN_KEEP + 1)) |
            while IFS=$'\t' read -r _ aid name; do
              echo "deleting $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
            done
