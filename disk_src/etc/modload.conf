# /etc/modload.conf - modules loaded at boot, in order.  See modload.conf(5).
# vfs, ufs and ufsdir are in the kernel image.  /etc/rc loads this list;
# /etc/rc.local loads the optional ones (serial, bpf, sscon, cda), and
# mount_prodos(8) loads prodos and prodosw, and mount_isofs(8) isofs.
ld
net
ramdisk
pty
klog
fpsim
# probe builds only; must be last
ufsprobe
