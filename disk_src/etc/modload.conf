# /etc/modload.conf - modules loaded once there is a root.  See modload.conf(5).
#
# One module per line, loaded in the order given.  vfs, ufs and ufsdir are NOT
# here: they are in the kernel image, because a module named in this file has
# to be read THROUGH a filesystem.  See fgxunix(5).
ld
serial
bpf
net
ramdisk
pty
# sscon, the console on a Second Sight card's Host Text mode: asks the slot
# cfg/system.cfg names and, when the card answers, takes the console over from
# the SHR renderer.  Without the card it logs that and does nothing.
sscon
# cda, classic desk accessory support: patches the Desk Manager's SaveAll and
# RestAll so the Ctrl-OA-Esc menu gives back FGX's border and text colours.
cda
# prodos and prodosw, the ProDOS filesystem type and its write half, are not
# here: mount_prodos(8) loads them when a ProDOS volume is mounted.
# klog, /dev/klog: a cursored read-only view of the kernel log ring, which is
# what syslogd reads kernel messages from.  No dependencies -- the ring exists
# before any module loads -- so its position here is only "before ufsprobe".
klog
# fpsim, the floating point simulator: fcc's soft double as one shared copy,
# reached through bank-0 FPSIM_TRAMP.  Until it loads, a double operation
# raises SIGILL.
fpsim
# ufsprobe LAST, and the order is load-bearing: it drives its cases from its own
# mod_init, so a case touching a pty needs pty.mod already up.  It does nothing
# unless a probe gate in cfg/system.cfg is on, and the image carries it only
# then (tools/ninja/gen.py), so /etc/rc loads it only when it is there.
ufsprobe
