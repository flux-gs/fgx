# Shared libraries made resident at boot, after libc, by ldload(8): one per
# line, `library major', in the order their cores stack -- a library after
# the ones it needs.  Every other library loads when a program first needs it.
#
# libfgx is listed because the boot's own daemons use it: dhclient, which
# /etc/netstart runs, and inetd.  Loaded here, its core is always the one
# below libc's, where it was assembled, so a library loaded later on first
# use lands at its assembled base when nothing outside the stacking order was
# loaded before it.  Binding is by name, and correct either way.
libfgx 1
