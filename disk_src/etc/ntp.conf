# /etc/ntp.conf -- ntpd(8)'s servers; see ntpd(8).
#
# 2.11BSD's (usr.sbin/ntp/ntp.conf) names University of Maryland hosts that
# are long gone.  These public servers still answer NTP version 1, which this
# ntpd speaks.  `server' polls them in client mode, which ntpd(8) recommends
# for a host that does not pass time on to others.  The clock's precision is
# not set here: ntpd takes it from kern.clockrate.
#
server	time.apple.com
server	time.google.com
server	time.cloudflare.com
server	pool.ntp.org
