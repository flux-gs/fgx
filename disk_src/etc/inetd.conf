#
# Internet server configuration database.  2.11BSD inetd.conf syntax, with an
# optional bind address added to the first field:
#
#   [host:]service  socktype  protocol  wait|nowait  user  server  [argv0 args]
#
# host is a dotted quad, or `*' (or omitted) for every address.  Upstream has
# no host part and always binds the wildcard, which is what the line below
# does: it answers the LAN when an Ethernet card is fitted and `telnet
# localhost' whether or not one is.  A host is only needed to serve ONE
# address -- 127.0.0.1 for this machine alone, say.
#
# This inetd honours `stream tcp nowait root' lines.  Anything else -- dgram/
# udp, wait, a non-root user, or the `internal' built-ins -- is named in the
# log and skipped, so a line left here does nothing quietly rather than
# half-working.
#
# The service name is looked up in /etc/services; a numeric name works too.
#
# With a card fitted this costs one of the three hardware sockets for as long
# as inetd runs.
telnet		stream	tcp	nowait	root	/testbin/telnetd	telnetd -i
